<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TorTerminal</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#11141a" />
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div class="brand" title="TorTerminal">
        <img src="/icon.svg" alt="" width="20" height="20" /><span>TorTerminal</span>
      </div>
      <button class="tb-btn" data-action="toggleSidebar" title="Toggle session manager"><i data-icon="sidebar"></i></button>
      <form id="quick-connect" autocomplete="off">
        <select id="qc-proto" title="Protocol">
          <option value="ssh">SSH</option>
          <option value="telnet">Telnet</option>
          <option value="raw">Raw</option>
          <option value="serial">Serial</option>
          <option value="local">Local</option>
        </select>
        <input id="qc-target" placeholder="Quick connect: user@host:port" spellcheck="false" />
        <button type="submit" class="tb-btn primary" title="Connect (Enter)"><i data-icon="plug"></i></button>
      </form>
      <div class="tb-group">
        <button class="tb-btn" data-action="newTab" title="New tab (Alt+Shift+T)"><i data-icon="plus"></i></button>
        <button class="tb-btn" data-action="localShell" title="Open local shell"><i data-icon="terminal"></i></button>
        <span class="tb-sep"></span>
        <button class="tb-btn" data-action="splitRight" title="Split right (Alt+Shift+D)"><i data-icon="splitV"></i></button>
        <button class="tb-btn" data-action="splitDown" title="Split down (Alt+Shift+E)"><i data-icon="splitH"></i></button>
        <button class="tb-btn" data-action="tile" title="Tile all panes in tab"><i data-icon="grid"></i></button>
        <button class="tb-btn" data-action="zoomPane" title="Maximize / restore pane (Alt+Shift+Enter)"><i data-icon="maximize"></i></button>
        <span class="tb-sep"></span>
        <button class="tb-btn" id="btn-broadcast" data-action="toggleBroadcast" title="Broadcast input to all panes in tab (Ctrl+Shift+B)"><i data-icon="broadcast"></i></button>
        <button class="tb-btn" data-action="toggleSftp" title="SFTP browser"><i data-icon="folderOpen"></i></button>
        <button class="tb-btn ai-tb" data-action="toggleAssistant" title="Claude assistant (Alt+Shift+A)"><i data-icon="sparkles"></i></button>
        <button class="tb-btn" data-action="toggleCommandWindow" title="Command window"><i data-icon="command"></i></button>
        <button class="tb-btn" data-action="toggleButtonBar" title="Button bar"><i data-icon="keyboard"></i></button>
        <span class="tb-sep"></span>
        <button class="tb-btn" data-action="showLogs" title="Session logs"><i data-icon="fileText"></i></button>
        <button class="tb-btn" data-action="palette" title="Command palette (Ctrl+Shift+P)"><i data-icon="search"></i></button>
        <button class="tb-btn" data-action="settings" title="Settings"><i data-icon="settings"></i></button>
        <button class="tb-btn hidden" id="btn-logout" data-action="logout" title="Log out"><i data-icon="lock"></i></button>
      </div>
    </header>

    <div id="main">
      <aside id="sidebar">
        <div class="sb-head">
          <span>Sessions</span>
          <div>
            <button class="icon-btn" data-action="newSession" title="New session"><i data-icon="plus"></i></button>
            <button class="icon-btn" data-action="newFolder" title="New folder"><i data-icon="folderPlus"></i></button>
            <button class="icon-btn" data-action="importSessions" title="Import sessions"><i data-icon="upload"></i></button>
            <button class="icon-btn" data-action="exportSessions" title="Export sessions"><i data-icon="download"></i></button>
          </div>
        </div>
        <input id="session-filter" class="sb-search" placeholder="Filter sessions…" spellcheck="false" />
        <div id="session-tree" class="tree"></div>
        <div class="sb-foot" id="sb-foot"></div>
      </aside>
      <div id="sidebar-resizer"></div>

      <section id="workspace">
        <nav id="tabbar">
          <div id="tabs"></div>
          <button class="icon-btn" data-action="newTab" title="New tab"><i data-icon="plus"></i></button>
        </nav>
        <div id="content">
          <div id="tab-views"></div>
          <aside id="sftp-panel" class="hidden"></aside>
          <aside id="ai-panel" class="hidden"></aside>
        </div>
        <div id="buttonbar"></div>
        <div id="command-window" class="hidden">
          <textarea id="cw-input" rows="2" spellcheck="false" placeholder="Type a command and press Enter to send (Shift+Enter = newline, ↑/↓ = history)"></textarea>
          <div class="cw-side">
            <select id="cw-target" title="Send to">
              <option value="active">Active pane</option>
              <option value="tab">All panes in tab</option>
              <option value="all">All sessions</option>
            </select>
            <label class="chk" title="Append Enter"><input type="checkbox" id="cw-enter" checked /> ⏎</label>
            <button class="btn primary sm" id="cw-send">Send</button>
          </div>
        </div>
      </section>
    </div>

    <footer id="statusbar">
      <span id="sb-state" class="sb-item"></span>
      <span id="sb-target" class="sb-item"></span>
      <span class="sb-spacer"></span>
      <span id="sb-log" class="sb-item"></span>
      <span id="sb-enc" class="sb-item"></span>
      <span id="sb-size" class="sb-item"></span>
      <span id="sb-traffic" class="sb-item"></span>
      <span id="sb-time" class="sb-item"></span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
